<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共有リスト</title>
<style>
  [hidden]{display:none!important}
  :root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#6b6b73;--line:#e0e0e6;--blue:#0a84ff;--red:#e5382d;--green:#28a745;}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#9a9aa3;--line:#2c2c2e;}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Hiragino Sans",sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;}
  h1{font-size:24px;margin:0;}
  #gear,#reload{border:0;background:none;color:var(--blue);font-size:15px;padding:8px;}
  #gear{font-size:18px;}
  #status{margin:0 16px 8px;font-size:13px;color:var(--muted);min-height:18px;}
  #status.err{color:var(--red);}
  h2{font-size:13px;color:var(--muted);margin:18px 16px 6px;font-weight:600;}
  .card{background:var(--card);margin:0 12px 8px;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;}
  .info{flex:1;min-width:0;}
  .name{font-size:17px;font-weight:600;}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .due{font-size:13px;font-weight:600;}
  .due.over{color:var(--red);} .due.today{color:#f08c00;}
  .empty{color:var(--muted);text-align:center;padding:30px 16px;}
  main{padding-bottom:30px;max-width:480px;margin:0 auto;}
  .seg{display:flex;gap:8px;margin:0 12px 8px;}
  .seg button{flex:1;padding:9px;border:0.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;}
  .seg button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .fab{margin:0 12px 10px;width:calc(100% - 24px);padding:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;}
  form.add{background:var(--card);margin:0 12px 12px;border-radius:14px;padding:12px 14px;display:none;}
  form.add.on{display:block;}
  form.add label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;}
  form.add input[type=text],form.add input[type=date]{width:100%;padding:10px;border:0.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;}
  form.add .seg{margin:0;}
  .row{display:flex;gap:8px;align-items:center;}
  button.fin{border:0;background:var(--green);color:#fff;font-size:15px;font-weight:600;border-radius:10px;padding:10px 14px;}
  button.fin:disabled{opacity:.5;}
  button.link{border:0;background:none;color:var(--blue);font-size:12px;padding:6px 0 0;}
  .col2{display:flex;flex-direction:column;gap:4px;align-items:stretch;}
</style>
</head>
<body>
<header><h1>📝 共有リスト</h1><span><button id="gear" title="設定">⚙︎</button><button id="reload">更新</button></span></header>
<p id="status"></p>
<main>
  <button class="fab" id="sl-toggle">＋ 追加</button>
  <form class="add" id="sl-form">
    <label>内容</label><input type="text" id="sl-title" maxlength="200" placeholder="例：牛乳／保育園に電話">
    <label>種別</label>
    <div class="seg" id="sl-kind"><button type="button" data-k="TODO" class="on">TODO</button><button type="button" data-k="買い物">買い物</button></div>
    <label>期限（任意）</label><input type="date" id="sl-due">
    <label>数量（任意・買い物のみ）</label><input type="text" id="sl-qty" maxlength="50" placeholder="例：2個">
    <div class="row" style="margin-top:12px;"><button type="submit" class="fab" style="margin:0;width:100%;" id="sl-save">保存</button></div>
  </form>
  <div id="sl-list"></div>
</main>

<script>
const DEFAULT_BASE = "https://daily-pilot-webhook.onrender.com";
function getToken(){ try { return localStorage.getItem("shared_list_token") || ""; } catch(e) { return ""; } }
function getBase(){ return DEFAULT_BASE; }
const $ = id => document.getElementById(id);
const md = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth()+1) + "/" + d.getDate(); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

function setStatus(msg, err){ const el = $("status"); el.textContent = msg || ""; el.className = err ? "err" : ""; }

async function api(path, opts = {}){
  const token = getToken();
  if (!token) throw new Error("トークンが未設定です。右上の ⚙︎ から設定してください。");
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 75000);
  try {
    const r = await fetch(getBase() + path, {...opts, signal: ctl.signal,
      headers: {"X-API-Key": token, "Content-Type": "application/json"}});
    if (!r.ok) throw new Error(r.status === 401 ? "認証に失敗しました（トークン不一致）" : "サーバーエラー (" + r.status + ")");
    return await r.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error("サーバーが応答しません。少し待って「更新」を押してください。");
    throw e;
  } finally { clearTimeout(timer); }
}

function slRow(it){
  const icon = it.kind === "買い物" ? "🛒" : "☑️";
  let due = "";
  if (it.due) {
    const diff = Math.round((new Date(todayStr() + "T00:00:00") - new Date(it.due + "T00:00:00")) / 86400000);
    const cls = diff > 0 ? "over" : diff === 0 ? "today" : "";
    const label = diff > 0 ? diff + "日超過" : diff === 0 ? "今日" : "あと" + (-diff) + "日";
    due = `<span class="due ${cls}">${label}</span>（${md(it.due)}） ・ `;
  }
  const sub = [due + (it.quantity ? esc(it.quantity) : ""), it.assignee && it.assignee !== "どちらでも" ? "担当:" + esc(it.assignee) : "", "👤" + esc(it.created_by)].filter(Boolean).join(" ・ ");
  return `<div class="card"><div class="info"><div class="name">${icon} ${esc(it.title)}</div>
    <div class="sub">${sub}</div></div>
    <div class="col2"><button class="fin" data-id="${esc(it.id)}" data-name="${esc(it.title)}">完了</button>
    <button class="link del" data-id="${esc(it.id)}" data-name="${esc(it.title)}">削除</button></div></div>`;
}

async function load(){
  setStatus("読み込み中…（スリープ中だと1分ほどかかります）");
  try {
    const items = await api("/shared-list/items?status=" + encodeURIComponent("未完了"));
    const todo = items.filter(i => i.kind === "TODO"), shopping = items.filter(i => i.kind === "買い物");
    let html = "";
    if (shopping.length) html += "<h2>買い物（" + shopping.length + "件）</h2>" + shopping.map(slRow).join("");
    if (todo.length) html += "<h2>TODO（" + todo.length + "件）</h2>" + todo.map(slRow).join("");
    $("sl-list").innerHTML = html || '<p class="empty">共有リストは空です</p>';
    setStatus("");
  } catch (e) { setStatus(e.message, true); }
}

let slKind = "TODO";
$("sl-toggle").onclick = () => {
  const f = $("sl-form"); f.classList.toggle("on");
  if (f.classList.contains("on")) $("sl-title").focus();
};
$("sl-kind").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  slKind = b.dataset.k;
  document.querySelectorAll("#sl-kind button").forEach(x => x.classList.toggle("on", x === b));
});
$("sl-form").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("sl-title").value.trim();
  if (!title) { setStatus("内容を入力してください", true); return; }
  $("sl-save").disabled = true;
  try {
    const body = {title, kind: slKind};
    if ($("sl-due").value) body.due = $("sl-due").value;
    if ($("sl-qty").value.trim()) body.quantity = $("sl-qty").value.trim();
    await api("/shared-list/items", {method: "POST", body: JSON.stringify(body)});
    $("sl-title").value = ""; $("sl-due").value = ""; $("sl-qty").value = ""; $("sl-form").classList.remove("on");
    await load(); setStatus("✅ 追加しました");
  } catch (err) { setStatus(err.message, true); }
  $("sl-save").disabled = false;
});
$("sl-list").addEventListener("click", async e => {
  const fin = e.target.closest("button.fin");
  if (fin) {
    if (!confirm("「" + fin.dataset.name + "」を完了にしますか？")) return;
    fin.disabled = true;
    try { await api("/shared-list/items/" + encodeURIComponent(fin.dataset.id) + "/done", {method: "POST"}); await load(); setStatus("✅ 完了にしました"); }
    catch (err) { setStatus(err.message, true); fin.disabled = false; }
    return;
  }
  const del = e.target.closest("button.del");
  if (del) {
    if (!confirm("「" + del.dataset.name + "」を削除しますか？")) return;
    del.disabled = true;
    try { await api("/shared-list/items/" + encodeURIComponent(del.dataset.id), {method: "DELETE"}); await load(); setStatus("🗑️ 削除しました"); }
    catch (err) { setStatus(err.message, true); del.disabled = false; }
  }
});

$("reload").onclick = load;
$("gear").onclick = () => {
  const cur = getToken();
  const v = prompt("共有リストのトークンを貼り付けてください" + (cur ? "\n（現在: 設定済み。空欄でOKすると変更しません）" : ""), "");
  if (v && v.trim()) { try { localStorage.setItem("shared_list_token", v.trim()); } catch(e) {} load(); }
};

load();
</script>
</body>
</html>
